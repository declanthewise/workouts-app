<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #faf8f4;
    font-family: 'DM Sans', sans-serif;
    color: #3a352e;
    position: relative;
    overflow: hidden;
  }
  .pad {
    padding: 96px 90px 80px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 64px;
  }
  .content { display: flex; flex-direction: column; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 124px;
    line-height: 1; color: #3a352e;
  }
  .eyebrow {
    font-size: 24px; font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: #a09888; margin-top: 26px;
  }
  .pills { display: flex; flex-direction: column; gap: 28px; flex: 0 0 auto; }
  .group { display: flex; flex-direction: column; gap: 12px; }
  .pill { width: 220px; height: 36px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="pad">
    <div class="content">
      <h1>Homebody</h1>
      <div class="eyebrow">Bodyweight Fitness · At Home</div>
    </div>
    <div class="pills">
      <div class="group">
        <div class="pill" style="background:#6a85a0"></div>
        <div class="pill" style="background:#6a85a0"></div>
      </div>
      <div class="group">
        <div class="pill" style="background:#7f9870"></div>
        <div class="pill" style="background:#7f9870"></div>
      </div>
      <div class="group">
        <div class="pill" style="background:#b08a68"></div>
        <div class="pill" style="background:#b08a68"></div>
      </div>
      <div class="group">
        <div class="pill" style="background:#9b8d7a"></div>
        <div class="pill" style="background:#9b8d7a"></div>
        <div class="pill" style="background:#9b8d7a"></div>
      </div>
    </div>
  </div>
</body>
</html>
